<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="title description">
  <title id="title">Neural network training cycle</title>
  <desc id="description">Input samples produce a forward prediction, the prediction is compared with known targets, loss is measured, and weights and biases are adjusted before the next cycle.</desc>
  <rect width="900" height="300" rx="18" fill="#f8fdff"/>
  <g font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="45" y="48" fill="#172b4d" font-size="21" font-weight="700">One training cycle</text>
    <g fill="#ffffff" stroke="#c9e8f3" stroke-width="2">
      <rect x="35" y="82" width="140" height="76" rx="12"/>
      <rect x="207" y="82" width="140" height="76" rx="12"/>
      <rect x="379" y="82" width="140" height="76" rx="12"/>
      <rect x="551" y="82" width="140" height="76" rx="12"/>
    </g>
    <rect x="723" y="82" width="142" height="76" rx="12" fill="#edf8f1" stroke="#75bd8c" stroke-width="2"/>
    <g fill="#172b4d" font-size="15" font-weight="600" text-anchor="middle">
      <text x="105" y="116">Input</text><text x="105" y="137">samples</text>
      <text x="277" y="116">Forward</text><text x="277" y="137">prediction</text>
      <text x="449" y="108">Compare with</text><text x="449" y="129">known</text><text x="449" y="150">targets</text>
      <text x="621" y="116">Measure</text><text x="621" y="137">loss</text>
    </g>
    <g fill="#215f36" font-size="15" font-weight="600" text-anchor="middle"><text x="794" y="108">Adjust weights</text><text x="794" y="129">and biases</text><text x="794" y="150">with optimizer</text></g>
    <g fill="none" stroke="#087ca7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M175 120h24M187 112l12 8-12 8M347 120h24M359 112l12 8-12 8M519 120h24M531 112l12 8-12 8M691 120h24M703 112l12 8-12 8"/>
    </g>
    <path d="M794 158v71H105v-63" fill="none" stroke="#2f9b53" stroke-width="3" stroke-dasharray="7 6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="m97 178 8-12 8 12" fill="none" stroke="#2f9b53" stroke-width="3" stroke-linecap="round"/>
    <text x="450" y="253" fill="#215f36" font-size="14" font-weight="600" text-anchor="middle">repeat with the updated parameters</text>
  </g>
</svg>
