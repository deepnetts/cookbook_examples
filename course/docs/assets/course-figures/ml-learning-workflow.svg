<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="title description">
  <title id="title">Traditional programming and supervised machine learning workflows</title>
  <desc id="description">Traditional programming combines data with human-written rules to produce a result. Supervised learning combines training data with known targets, uses a training algorithm to learn a model, and then combines that model with new data to make predictions.</desc>
  <rect width="880" height="520" rx="18" fill="#f8fdff"/>
  <g font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="55" y="52" fill="#172b4d" font-size="21" font-weight="700">Traditional programming</text>
    <g fill="#ffffff" stroke="#c9e8f3" stroke-width="2"><rect x="55" y="78" width="160" height="66" rx="12"/><rect x="295" y="78" width="180" height="66" rx="12"/><rect x="645" y="78" width="180" height="66" rx="12"/></g>
    <circle cx="255" cy="111" r="24" fill="#e5f7fc" stroke="#67c4e3" stroke-width="2"/>
    <g fill="#172b4d" font-size="17" font-weight="600" text-anchor="middle"><text x="135" y="117">Data</text><text x="385" y="117">Written rules</text><text x="735" y="117">Result</text></g>
    <text x="255" y="118" fill="#075985" font-size="24" font-weight="700" text-anchor="middle">+</text>
    <g fill="none" stroke="#087ca7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M215 111h16M279 111h16M475 111h162"/><path d="m625 103 12 8-12 8"/></g>

    <text x="55" y="218" fill="#172b4d" font-size="21" font-weight="700">Training a supervised model</text>
    <g fill="#ffffff" stroke="#c9e8f3" stroke-width="2"><rect x="35" y="244" width="160" height="70" rx="12"/><rect x="255" y="244" width="160" height="70" rx="12"/><rect x="475" y="244" width="160" height="70" rx="12"/><rect x="690" y="244" width="155" height="70" rx="12"/></g>
    <circle cx="225" cy="279" r="22" fill="#e5f7fc" stroke="#67c4e3" stroke-width="2"/>
    <g fill="#172b4d" font-size="16" font-weight="600" text-anchor="middle"><text x="115" y="285">Training data</text><text x="335" y="274">Known</text><text x="335" y="295">targets</text><text x="555" y="274">Training</text><text x="555" y="295">algorithm</text><text x="767" y="274">Trained</text><text x="767" y="295">model</text></g>
    <text x="225" y="286" fill="#075985" font-size="22" font-weight="700" text-anchor="middle">+</text>
    <g fill="none" stroke="#087ca7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M195 279h8M247 279h8M415 279h52M455 271l12 8-12 8M635 279h47M670 271l12 8-12 8"/></g>

    <text x="55" y="383" fill="#172b4d" font-size="21" font-weight="700">Using the trained model</text>
    <g fill="#edf8f1" stroke="#75bd8c" stroke-width="2"><rect x="105" y="408" width="160" height="66" rx="12"/><rect x="360" y="408" width="180" height="66" rx="12"/><rect x="645" y="408" width="180" height="66" rx="12"/></g>
    <g fill="#215f36" font-size="16" font-weight="600" text-anchor="middle"><text x="185" y="447">New data</text><text x="450" y="436">Use trained</text><text x="450" y="457">model</text><text x="735" y="447">Prediction</text></g>
    <g fill="none" stroke="#2f9b53" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M265 441h87M340 433l12 8-12 8M540 441h97M625 433l12 8-12 8M767 314v69H450v17"/><path d="m442 388 8 12 8-12"/></g>
  </g>
</svg>
