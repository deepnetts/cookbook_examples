<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" role="img" aria-labelledby="title description">
  <title id="title">Computation performed by one neuron</title>
  <desc id="description">Input values enter a weighted sum with a bias, the result passes through an activation function, and the neuron returns its output.</desc>
  <rect width="900" height="270" rx="18" fill="#f8fdff"/>
  <g font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="45" y="47" fill="#172b4d" font-size="21" font-weight="700">Inside one neuron</text>
    <g fill="#ffffff" stroke="#c9e8f3" stroke-width="2">
      <rect x="40" y="86" width="150" height="92" rx="14"/>
      <rect x="258" y="76" width="220" height="112" rx="14"/>
      <rect x="546" y="86" width="155" height="92" rx="46"/>
    </g>
    <rect x="770" y="86" width="90" height="92" rx="14" fill="#edf8f1" stroke="#75bd8c" stroke-width="2"/>
    <g fill="#172b4d" text-anchor="middle">
      <text x="115" y="124" font-size="17" font-weight="700">Inputs</text><text x="115" y="150" fill="#52657a" font-size="14">x₁ … xₙ</text>
      <text x="368" y="111" font-size="17" font-weight="700">Weighted sum + bias</text><text x="368" y="139" fill="#075985" font-size="15" font-weight="600">z = Σ wᵢxᵢ + b</text><text x="368" y="164" fill="#52657a" font-size="13">learned parameters</text>
      <text x="623" y="124" font-size="17" font-weight="700">Activation</text><text x="623" y="150" fill="#075985" font-size="15" font-weight="600">a = f(z)</text>
    </g>
    <g fill="#215f36" text-anchor="middle"><text x="815" y="124" font-size="16" font-weight="700">Output</text><text x="815" y="150" font-size="15" font-weight="600">a</text></g>
    <g fill="none" stroke="#087ca7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M190 132h56M232 122l14 10-14 10M478 132h56M520 122l14 10-14 10M701 132h57M744 122l14 10-14 10"/>
    </g>
  </g>
</svg>
