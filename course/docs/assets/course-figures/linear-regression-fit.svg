<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" role="img" aria-labelledby="title description">
  <title id="title">Linear regression fitted to sorting benchmark measurements</title>
  <desc id="description">A scatter plot of comparison count against execution time. A rising fitted line passes between measurements above and below it, while dashed vertical residual lines show the difference between observed and predicted values.</desc>

  <rect width="880" height="500" rx="18" fill="#f8fdff"/>
  <rect x="84" y="48" width="730" height="350" rx="12" fill="#ffffff" stroke="#c9e8f3" stroke-width="2"/>

  <g stroke="#e2edf2" stroke-width="1">
    <path d="M134 118H774M134 188H774M134 258H774M134 328H774"/>
    <path d="M254 78V368M374 78V368M494 78V368M614 78V368M734 78V368"/>
  </g>

  <g fill="none" stroke="#52657a" stroke-width="2.5" stroke-linecap="round">
    <path d="M134 78V368H774"/>
    <path d="m126 90 8-12 8 12M762 360l12 8-12 8"/>
  </g>

  <g fill="#52657a" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15">
    <text x="134" y="394" text-anchor="middle">0</text>
    <text x="254" y="394" text-anchor="middle">25k</text>
    <text x="374" y="394" text-anchor="middle">50k</text>
    <text x="494" y="394" text-anchor="middle">75k</text>
    <text x="614" y="394" text-anchor="middle">100k</text>
    <text x="734" y="394" text-anchor="middle">125k</text>
    <text x="454" y="430" text-anchor="middle" font-size="17" font-weight="600" fill="#172b4d">Comparison count</text>
    <text x="28" y="226" text-anchor="middle" font-size="17" font-weight="600" fill="#172b4d" transform="rotate(-90 28 226)">Execution time</text>
  </g>

  <path d="M156 337L746 103" fill="none" stroke="#087ca7" stroke-width="5" stroke-linecap="round"/>

  <g fill="none" stroke="#7c8d9c" stroke-width="2" stroke-dasharray="5 6">
    <path d="M200 302V320M264 311V294M326 250V270M390 260V244M454 198V219M518 210V193M582 150V168M646 160V142M710 99V117"/>
  </g>

  <g fill="#2f9b53" stroke="#ffffff" stroke-width="3">
    <circle cx="200" cy="302" r="8"/>
    <circle cx="264" cy="311" r="8"/>
    <circle cx="326" cy="250" r="8"/>
    <circle cx="390" cy="260" r="8"/>
    <circle cx="454" cy="198" r="8"/>
    <circle cx="518" cy="210" r="8"/>
    <circle cx="582" cy="150" r="8"/>
    <circle cx="646" cy="160" r="8"/>
    <circle cx="710" cy="99" r="8"/>
  </g>

  <g font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="532" y="278" width="218" height="66" rx="10" fill="#f3f7fa" stroke="#c7d3dc"/>
    <path d="M552 299H588" stroke="#087ca7" stroke-width="5" stroke-linecap="round"/>
    <text x="600" y="304" fill="#172b4d" font-size="15">Fitted line</text>
    <path d="M552 324H588" stroke="#7c8d9c" stroke-width="2" stroke-dasharray="5 6"/>
    <text x="600" y="329" fill="#172b4d" font-size="15">Residual</text>
    <rect x="585" y="19" width="182" height="43" rx="21.5" fill="#e5f7fc" stroke="#67c4e3"/>
    <text x="676" y="47" text-anchor="middle" fill="#075985" font-size="20" font-weight="700">ŷ = wx + b</text>
  </g>
</svg>
