<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" role="img" aria-labelledby="title description">
  <title id="title">Binary classification confusion matrix</title>
  <desc id="description">A two-by-two matrix compares actual positive and negative labels with predicted positive and negative labels, producing true positive, false negative, false positive, and true negative outcomes.</desc>
  <rect width="860" height="470" rx="18" fill="#f8fdff"/>
  <g font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="430" y="48" fill="#172b4d" font-size="21" font-weight="700" text-anchor="middle">Binary classification outcomes</text>

    <text x="535" y="84" fill="#087ca7" font-size="15" font-weight="750" letter-spacing="1.2" text-anchor="middle">PREDICTED LABEL</text>
    <text x="38" y="284" fill="#087ca7" font-size="15" font-weight="750" letter-spacing="1.2" text-anchor="middle" transform="rotate(-90 38 284)">ACTUAL LABEL</text>

    <g fill="#073b61">
      <rect x="330" y="102" width="205" height="54" rx="10"/>
      <rect x="547" y="102" width="205" height="54" rx="10"/>
      <rect x="92" y="168" width="220" height="120" rx="10"/>
      <rect x="92" y="300" width="220" height="120" rx="10"/>
    </g>
    <g fill="#ffffff" font-size="16" font-weight="700" text-anchor="middle">
      <text x="432" y="135">Positive</text>
      <text x="649" y="135">Negative</text>
      <text x="202" y="234">Actually positive</text>
      <text x="202" y="366">Actually negative</text>
    </g>

    <rect x="330" y="168" width="205" height="120" rx="12" fill="#e8f7ed" stroke="#65b77f" stroke-width="2"/>
    <rect x="547" y="168" width="205" height="120" rx="12" fill="#fff5df" stroke="#e0aa45" stroke-width="2"/>
    <rect x="330" y="300" width="205" height="120" rx="12" fill="#fff5df" stroke="#e0aa45" stroke-width="2"/>
    <rect x="547" y="300" width="205" height="120" rx="12" fill="#e8f7ed" stroke="#65b77f" stroke-width="2"/>

    <g text-anchor="middle">
      <g fill="#215f36">
        <text x="432" y="215" font-size="26" font-weight="800">TP</text>
        <text x="432" y="246" font-size="15" font-weight="650">True positive</text>
        <text x="649" y="347" font-size="26" font-weight="800">TN</text>
        <text x="649" y="378" font-size="15" font-weight="650">True negative</text>
      </g>
      <g fill="#805a14">
        <text x="649" y="215" font-size="26" font-weight="800">FN</text>
        <text x="649" y="246" font-size="15" font-weight="650">False negative</text>
        <text x="432" y="347" font-size="26" font-weight="800">FP</text>
        <text x="432" y="378" font-size="15" font-weight="650">False positive</text>
      </g>
    </g>

    <g font-size="13" text-anchor="middle">
      <text x="432" y="268" fill="#3e6850">correct prediction</text>
      <text x="649" y="268" fill="#765e31">missed positive</text>
      <text x="432" y="400" fill="#765e31">false alarm</text>
      <text x="649" y="400" fill="#3e6850">correct prediction</text>
    </g>
  </g>
</svg>
