<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" role="img" aria-labelledby="title description">
  <title id="title">Logistic regression prediction flow</title>
  <desc id="description">Feature values produce a weighted linear score, the Sigmoid function converts the score into a probability, and a threshold converts the probability into a binary class.</desc>
  <rect width="900" height="310" rx="18" fill="#f8fdff"/>
  <g font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="450" y="45" fill="#172b4d" font-size="21" font-weight="700" text-anchor="middle">From features to a binary decision</text>
    <g fill="#ffffff" stroke="#8dd8ea" stroke-width="2">
      <rect x="34" y="96" width="142" height="100" rx="13"/>
      <rect x="210" y="96" width="160" height="100" rx="13"/>
      <rect x="404" y="96" width="142" height="100" rx="13"/>
      <rect x="580" y="96" width="124" height="100" rx="13"/>
    </g>
    <rect x="738" y="96" width="128" height="100" rx="13" fill="#edf8f1" stroke="#75bd8c" stroke-width="2"/>
    <g text-anchor="middle">
      <text x="105" y="138" fill="#172b4d" font-size="16" font-weight="700">Features</text><text x="105" y="164" fill="#52657a" font-size="13">x₁, x₂, ... xₘ</text>
      <text x="290" y="129" fill="#172b4d" font-size="16" font-weight="700">Linear score</text><text x="290" y="156" fill="#075985" font-size="14">z = w·x + b</text><text x="290" y="178" fill="#52657a" font-size="12">any real number</text>
      <text x="475" y="138" fill="#172b4d" font-size="16" font-weight="700">Sigmoid</text><text x="475" y="164" fill="#075985" font-size="14">σ(z)</text>
      <text x="642" y="138" fill="#172b4d" font-size="16" font-weight="700">Probability</text><text x="642" y="164" fill="#075985" font-size="14">0 &lt; p &lt; 1</text>
      <text x="802" y="129" fill="#215f36" font-size="16" font-weight="700">Class</text><text x="802" y="156" fill="#215f36" font-size="14">p ≥ 0.5 → 1</text><text x="802" y="178" fill="#3e6850" font-size="14">p &lt; 0.5 → 0</text>
    </g>
    <g fill="none" stroke="#087ca7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M176 146h24"/><path d="m188 138 12 8-12 8"/>
      <path d="M370 146h24"/><path d="m382 138 12 8-12 8"/>
      <path d="M546 146h24"/><path d="m558 138 12 8-12 8"/>
      <path d="M704 146h24"/><path d="m716 138 12 8-12 8"/>
    </g>
    <text x="450" y="245" fill="#52657a" font-size="14" text-anchor="middle">Training learns the weights and bias; prediction applies the learned transformation.</text>
  </g>
</svg>
