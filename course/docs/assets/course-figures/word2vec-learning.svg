<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" role="img" aria-labelledby="title description">
  <title id="title">How Word2Vec learns word embeddings</title>
  <desc id="description">A context window creates CBOW and Skip-gram prediction tasks, whose learned weights place words used in similar contexts near one another in vector space.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10" fill="none" stroke="#087ca7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="900" height="570" rx="18" fill="#f8fdff"/>
  <g font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="450" y="43" fill="#172b4d" font-size="22" font-weight="750" text-anchor="middle">Word2Vec learns from neighboring words</text>

    <text x="450" y="82" fill="#52657a" font-size="14" text-anchor="middle">A moving context window turns ordinary text into prediction examples.</text>
    <g font-size="15" text-anchor="middle">
      <rect x="164" y="104" width="122" height="52" rx="10" fill="#fff" stroke="#8dd8ea" stroke-width="2"/>
      <rect x="300" y="104" width="122" height="52" rx="10" fill="#edf8f1" stroke="#75bd8c" stroke-width="2"/>
      <rect x="436" y="104" width="122" height="52" rx="10" fill="#fff" stroke="#8dd8ea" stroke-width="2"/>
      <rect x="572" y="104" width="122" height="52" rx="10" fill="#fff" stroke="#d3e4eb" stroke-width="2"/>
      <text x="225" y="136" fill="#172b4d">java</text>
      <text x="361" y="136" fill="#215f36" font-weight="750">neural</text>
      <text x="497" y="136" fill="#172b4d">network</text>
      <text x="633" y="136" fill="#172b4d">training</text>
    </g>
    <path d="M151 92 V169 H570 V92" fill="none" stroke="#2f9b53" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="361" y="186" fill="#2f7d48" font-size="12" font-weight="700" text-anchor="middle">example context window</text>

    <g>
      <rect x="44" y="222" width="372" height="192" rx="15" fill="#fff" stroke="#8dd8ea" stroke-width="2"/>
      <rect x="484" y="222" width="372" height="192" rx="15" fill="#fff" stroke="#8dd8ea" stroke-width="2"/>
      <text x="230" y="258" fill="#075985" font-size="18" font-weight="750" text-anchor="middle">CBOW</text>
      <text x="670" y="258" fill="#075985" font-size="18" font-weight="750" text-anchor="middle">Skip-gram</text>
      <text x="230" y="282" fill="#52657a" font-size="12" text-anchor="middle">context predicts the center word</text>
      <text x="670" y="282" fill="#52657a" font-size="12" text-anchor="middle">center word predicts its context</text>

      <rect x="70" y="312" width="105" height="60" rx="10" fill="#f3f8fa" stroke="#d3e4eb"/>
      <text x="122" y="336" fill="#172b4d" font-size="13" text-anchor="middle">java</text>
      <text x="122" y="357" fill="#172b4d" font-size="13" text-anchor="middle">network</text>
      <path d="M176 342 H274" fill="none" stroke="#087ca7" stroke-width="2.5" marker-end="url(#arrow)"/>
      <rect x="278" y="312" width="108" height="60" rx="10" fill="#edf8f1" stroke="#75bd8c" stroke-width="2"/>
      <text x="332" y="347" fill="#215f36" font-size="14" font-weight="750" text-anchor="middle">neural</text>

      <rect x="510" y="312" width="108" height="60" rx="10" fill="#edf8f1" stroke="#75bd8c" stroke-width="2"/>
      <text x="564" y="347" fill="#215f36" font-size="14" font-weight="750" text-anchor="middle">neural</text>
      <path d="M619 342 H716" fill="none" stroke="#087ca7" stroke-width="2.5" marker-end="url(#arrow)"/>
      <rect x="720" y="312" width="106" height="60" rx="10" fill="#f3f8fa" stroke="#d3e4eb"/>
      <text x="773" y="336" fill="#172b4d" font-size="13" text-anchor="middle">java</text>
      <text x="773" y="357" fill="#172b4d" font-size="13" text-anchor="middle">network</text>
    </g>

    <path d="M450 424 V456" fill="none" stroke="#087ca7" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="114" y="465" width="672" height="70" rx="14" fill="#edf8f1" stroke="#75bd8c" stroke-width="2"/>
    <text x="450" y="493" fill="#215f36" font-size="16" font-weight="750" text-anchor="middle">Learned embedding space</text>
    <text x="450" y="519" fill="#3e6850" font-size="14" text-anchor="middle">words used in similar contexts → vectors positioned near one another</text>
  </g>
</svg>
