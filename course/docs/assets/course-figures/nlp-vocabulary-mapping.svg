<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-labelledby="title description">
  <title id="title">Vocabulary token-to-index mapping</title>
  <desc id="description">A stable vocabulary maps unknown, java, neural, network, and training tokens to numerical indices zero through four.</desc>
  <rect width="900" height="390" rx="18" fill="#f8fdff"/>
  <g font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="450" y="45" fill="#172b4d" font-size="21" font-weight="700" text-anchor="middle">A vocabulary gives every known token a stable index</text>
    <rect x="212" y="76" width="476" height="266" rx="15" fill="#ffffff" stroke="#8dd8ea" stroke-width="2"/>
    <rect x="212" y="76" width="476" height="48" rx="15" fill="#073b61"/>
    <path d="M212 109h476" stroke="#073b61" stroke-width="30"/>
    <text x="304" y="107" fill="#ffffff" font-size="14" font-weight="750" text-anchor="middle">INDEX</text>
    <text x="500" y="107" fill="#ffffff" font-size="14" font-weight="750" text-anchor="middle">TOKEN</text>
    <path d="M392 76v266" stroke="#d6e8ef" stroke-width="2"/>
    <g stroke="#dcebf1" stroke-width="1.5"><path d="M212 168h476M212 212h476M212 256h476M212 300h476"/></g>
    <rect x="214" y="124" width="472" height="44" fill="#fff8e8"/>
    <g text-anchor="middle" font-size="16">
      <g fill="#075985" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700">
        <text x="304" y="153">0</text><text x="304" y="197">1</text><text x="304" y="241">2</text><text x="304" y="285">3</text><text x="304" y="329">4</text>
      </g>
      <g fill="#172b4d" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
        <text x="500" y="153">&lt;UNKNOWN&gt;</text><text x="500" y="197">java</text><text x="500" y="241">neural</text><text x="500" y="285">network</text><text x="500" y="329">training</text>
      </g>
    </g>
    <rect x="708" y="129" width="142" height="58" rx="11" fill="#fff5df" stroke="#e0aa45" stroke-width="1.5"/>
    <text x="779" y="151" fill="#805a14" font-size="12" font-weight="700" text-anchor="middle">Reserved fallback</text>
    <text x="779" y="170" fill="#765e31" font-size="11" text-anchor="middle">for unseen tokens</text>
    <path d="M708 158H696" fill="none" stroke="#d19a32" stroke-width="2.5" stroke-linecap="round"/>
    <path d="m702 151-8 7 8 7" fill="none" stroke="#d19a32" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
