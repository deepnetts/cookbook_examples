<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="title description">
  <title id="title">Linear and nonlinear regression network architectures</title>
  <desc id="description">Linear regression connects input features directly to a Linear output. Nonlinear regression first transforms inputs through hidden layers with Tanh or ReLU activation, then uses a Linear output for the continuous prediction.</desc>
  <rect width="900" height="400" rx="18" fill="#f8fdff"/>
  <g font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="45" y="50" fill="#172b4d" font-size="21" font-weight="700">When hidden layers change the model</text>

    <text x="45" y="100" fill="#172b4d" font-size="17" font-weight="700">Linear regression</text>
    <g fill="#ffffff" stroke="#c9e8f3" stroke-width="2">
      <rect x="245" y="72" width="160" height="64" rx="12"/>
    </g>
    <rect x="665" y="72" width="175" height="64" rx="12" fill="#edf8f1" stroke="#75bd8c" stroke-width="2"/>
    <g fill="#172b4d" font-size="16" font-weight="600" text-anchor="middle"><text x="325" y="110">Input features</text></g>
    <g fill="#215f36" font-size="16" font-weight="700" text-anchor="middle"><text x="752" y="99">Linear output</text><text x="752" y="121">continuous value</text></g>
    <g fill="none" stroke="#087ca7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M405 104h252M645 96l12 8-12 8"/></g>
    <rect x="470" y="86" width="120" height="36" rx="18" fill="#e5f7fc" stroke="#67c4e3"/>
    <text x="530" y="109" fill="#075985" font-size="13" font-weight="700" text-anchor="middle">no hidden layer</text>

    <path d="M45 169H855" stroke="#d8e7ed" stroke-width="2"/>
    <text x="45" y="218" fill="#172b4d" font-size="17" font-weight="700">Nonlinear regression</text>
    <g fill="#ffffff" stroke="#c9e8f3" stroke-width="2">
      <rect x="45" y="238" width="145" height="70" rx="12"/>
      <rect x="240" y="238" width="165" height="70" rx="12"/>
    </g>
    <rect x="455" y="238" width="165" height="70" rx="12" fill="#ffffff" stroke="#087ca7" stroke-width="2.5"/>
    <rect x="670" y="238" width="170" height="70" rx="12" fill="#edf8f1" stroke="#75bd8c" stroke-width="2"/>
    <g fill="#172b4d" font-size="15" font-weight="600" text-anchor="middle">
      <text x="117" y="279">Input features</text>
      <text x="322" y="267">Hidden layer</text><text x="322" y="289">Tanh / ReLU</text>
      <text x="537" y="267">Hidden layer</text><text x="537" y="289">Tanh / ReLU</text>
    </g>
    <g fill="#215f36" font-size="15" font-weight="700" text-anchor="middle"><text x="755" y="267">Linear output</text><text x="755" y="289">continuous value</text></g>
    <g fill="none" stroke="#087ca7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M190 273h42M220 265l12 8-12 8M405 273h42M435 265l12 8-12 8M620 273h42M650 265l12 8-12 8"/>
    </g>
    <rect x="300" y="338" width="300" height="38" rx="19" fill="#e5f7fc" stroke="#67c4e3"/>
    <text x="450" y="362" fill="#075985" font-size="14" font-weight="700" text-anchor="middle">hidden activations can bend the relationship</text>
  </g>
</svg>
