<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" role="img" aria-labelledby="title description">
  <title id="title">Shared responsibility of predictive models</title>
  <desc id="description">Input features pass through a learned transformation to produce a prediction.</desc>
  <rect width="880" height="230" rx="18" fill="#f8fdff"/>
  <g font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <g fill="#ffffff" stroke="#c9e8f3" stroke-width="2">
      <rect x="55" y="69" width="185" height="92" rx="14"/>
      <rect x="315" y="59" width="255" height="112" rx="56"/>
    </g>
    <rect x="640" y="69" width="185" height="92" rx="14" fill="#edf8f1" stroke="#75bd8c" stroke-width="2"/>
    <g fill="#172b4d" text-anchor="middle">
      <text x="147" y="108" font-size="18" font-weight="700">Features</text>
      <text x="147" y="135" fill="#52657a" font-size="14">x₁, x₂, …, xₙ</text>
      <text x="442" y="104" font-size="18" font-weight="700">Learned transformation</text>
      <text x="442" y="132" fill="#52657a" font-size="15">fθ(x)</text>
    </g>
    <g fill="#215f36" text-anchor="middle"><text x="732" y="108" font-size="18" font-weight="700">Prediction</text><text x="732" y="135" font-size="15" font-weight="600">ŷ</text></g>
    <g fill="none" stroke="#087ca7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M240 115h63M289 105l14 10-14 10M570 115h58M614 105l14 10-14 10"/>
    </g>
  </g>
</svg>
