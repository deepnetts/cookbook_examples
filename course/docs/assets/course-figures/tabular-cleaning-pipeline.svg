<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title description">
  <title id="title">From a raw dataset to fitted Deep Netts preprocessing</title>
  <desc id="description">A raw dataset is inspected and cleaned with DFLib or Tablesaw, exported as a model-ready CSV, loaded with Deep Netts DataSets, split, and preprocessed.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10" fill="none" stroke="#087ca7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="900" height="500" rx="18" fill="#f8fdff"/>
  <g font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="450" y="43" fill="#172b4d" font-size="22" font-weight="750" text-anchor="middle">Prepare incomplete tabular data before training</text>

    <rect x="42" y="78" width="816" height="154" rx="15" fill="#fff" stroke="#8dd8ea" stroke-width="2"/>
    <rect x="63" y="64" width="195" height="32" rx="9" fill="#073b61"/>
    <text x="160" y="86" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">Dataframe preparation</text>
    <g text-anchor="middle">
      <rect x="82" y="123" width="176" height="68" rx="11" fill="#f3f8fa" stroke="#d3e4eb" stroke-width="2"/>
      <rect x="362" y="113" width="176" height="88" rx="11" fill="#fff" stroke="#67c4e3" stroke-width="2"/>
      <rect x="642" y="123" width="176" height="68" rx="11" fill="#edf8f1" stroke="#75bd8c" stroke-width="2"/>
      <text x="170" y="162" fill="#172b4d" font-size="15" font-weight="700">Raw dataset</text>
      <text x="450" y="145" fill="#075985" font-size="15" font-weight="700">Inspect and clean</text>
      <text x="450" y="169" fill="#52657a" font-size="13">DFLib or Tablesaw</text>
      <text x="450" y="188" fill="#52657a" font-size="11">missing values · types · duplicates</text>
      <text x="730" y="153" fill="#215f36" font-size="15" font-weight="700">Model-ready</text>
      <text x="730" y="174" fill="#3e6850" font-size="13">CSV</text>
    </g>
    <path d="M259 157 H359 M539 157 H639" fill="none" stroke="#087ca7" stroke-width="2.5" marker-end="url(#arrow)"/>

    <path d="M730 192 V307 H170 V326" fill="none" stroke="#087ca7" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="42" y="278" width="816" height="164" rx="15" fill="#fff" stroke="#75bd8c" stroke-width="2"/>
    <rect x="63" y="264" width="176" height="32" rx="9" fill="#2f7d48"/>
    <text x="151" y="286" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">Deep Netts pipeline</text>
    <g text-anchor="middle">
      <rect x="82" y="329" width="176" height="68" rx="11" fill="#edf8f1" stroke="#75bd8c" stroke-width="2"/>
      <rect x="362" y="329" width="176" height="68" rx="11" fill="#fff" stroke="#8dd8ea" stroke-width="2"/>
      <rect x="642" y="319" width="176" height="88" rx="11" fill="#edf8f1" stroke="#75bd8c" stroke-width="2"/>
      <text x="170" y="357" fill="#215f36" font-size="15" font-weight="700">DataSets</text>
      <text x="170" y="379" fill="#3e6850" font-size="12">read numerical CSV</text>
      <text x="450" y="357" fill="#075985" font-size="15" font-weight="700">Train/test split</text>
      <text x="450" y="379" fill="#52657a" font-size="12">preserve unseen data</text>
      <text x="730" y="343" fill="#215f36" font-size="15" font-weight="700">Fitted</text>
      <text x="730" y="364" fill="#215f36" font-size="15" font-weight="700">preprocessing</text>
      <text x="730" y="385" fill="#3e6850" font-size="12">fit on train · reuse on test</text>
    </g>
    <path d="M259 363 H359 M539 363 H639" fill="none" stroke="#087ca7" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="450" y="474" fill="#52657a" font-size="13" text-anchor="middle">Cleaning makes the schema usable; fitted preprocessing makes numerical values suitable for the model.</text>
  </g>
</svg>
