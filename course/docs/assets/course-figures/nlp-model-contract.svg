<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" role="img" aria-labelledby="title description">
  <title id="title">Machine Learning model contract</title>
  <desc id="description">Numerical features enter a learned model and produce a task-specific prediction.</desc>
  <rect width="900" height="250" rx="18" fill="#f8fdff"/>
  <g font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="450" y="44" fill="#172b4d" font-size="20" font-weight="700" text-anchor="middle">The familiar model contract</text>
    <rect x="95" y="83" width="190" height="100" rx="14" fill="#eaf8fb" stroke="#67c4e3" stroke-width="2"/>
    <rect x="355" y="83" width="190" height="100" rx="14" fill="#ffffff" stroke="#8dcfdf" stroke-width="2"/>
    <rect x="615" y="83" width="190" height="100" rx="14" fill="#edf8f1" stroke="#75bd8c" stroke-width="2"/>
    <g text-anchor="middle">
      <text x="190" y="126" fill="#075985" font-size="18" font-weight="750">Features</text>
      <text x="190" y="153" fill="#52657a" font-size="13">numerical model input</text>
      <text x="450" y="126" fill="#172b4d" font-size="18" font-weight="750">Model</text>
      <text x="450" y="153" fill="#52657a" font-size="13">learned transformation</text>
      <text x="710" y="126" fill="#215f36" font-size="18" font-weight="750">Prediction</text>
      <text x="710" y="153" fill="#3e6850" font-size="13">task-specific output</text>
    </g>
    <g fill="none" stroke="#087ca7" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M285 133h70"/><path d="m343 125 12 8-12 8"/>
      <path d="M545 133h70"/><path d="m603 125 12 8-12 8"/>
    </g>
  </g>
</svg>
