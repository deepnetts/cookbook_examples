<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-labelledby="title description">
  <title id="title">Linear, ReLU, and Sigmoid activation functions</title>
  <desc id="description">Three coordinate plots compare a Linear activation that passes values unchanged, a ReLU activation that outputs zero for negative inputs and grows linearly for positive inputs, and a Sigmoid activation that smoothly maps values between zero and one.</desc>
  <rect width="900" height="390" rx="18" fill="#f8fdff"/>

  <g font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <g fill="#ffffff" stroke="#c9e8f3" stroke-width="2">
      <rect x="35" y="35" width="250" height="305" rx="14"/>
      <rect x="325" y="35" width="250" height="305" rx="14"/>
      <rect x="615" y="35" width="250" height="305" rx="14"/>
    </g>

    <g fill="#172b4d" font-size="20" font-weight="700" text-anchor="middle">
      <text x="160" y="72">Linear</text>
      <text x="450" y="72">ReLU</text>
      <text x="740" y="72">Sigmoid</text>
    </g>
    <g fill="#075985" font-size="15" font-weight="600" text-anchor="middle">
      <text x="160" y="98">f(x) = x</text>
      <text x="450" y="98">f(x) = max(0, x)</text>
      <text x="740" y="98">f(x) = 1 / (1 + e⁻ˣ)</text>
    </g>

    <g fill="none" stroke="#c7d3dc" stroke-width="1.5">
      <path d="M65 215H255M160 120V290"/>
      <path d="M355 250H545M450 120V290"/>
      <path d="M645 280H835M740 120V290"/>
    </g>
    <g fill="none" stroke="#52657a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m247 209 8 6-8 6M154 128l6-8 6 8"/>
      <path d="m537 244 8 6-8 6M444 128l6-8 6 8"/>
      <path d="m827 274 8 6-8 6M734 128l6-8 6 8"/>
    </g>

    <path d="M82 278L238 137" fill="none" stroke="#087ca7" stroke-width="5" stroke-linecap="round"/>
    <path d="M365 250H450L532 139" fill="none" stroke="#2f9b53" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M653 274C708 274 772 135 827 135" fill="none" stroke="#087ca7" stroke-width="5" stroke-linecap="round"/>

    <g fill="#52657a" font-size="13">
      <text x="246" y="235">x</text><text x="171" y="132">y</text>
      <text x="536" y="270">x</text><text x="461" y="132">y</text>
      <text x="826" y="301">x</text><text x="751" y="132">y</text>
      <text x="720" y="140">1</text><text x="720" y="276">0</text><text x="746" y="220">0.5</text>
    </g>

    <g fill="#52657a" font-size="14" text-anchor="middle">
      <text x="160" y="319">Unrestricted output</text>
      <text x="450" y="319">Zero below 0; linear above 0</text>
      <text x="740" y="319">Smooth probability from 0 to 1</text>
    </g>
  </g>
</svg>
