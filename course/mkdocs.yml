      - Overview: examples/index.md
      - Regression:
          - Overview: examples/regression/index.md
          - Simple Linear Regression: examples/regression/linear-regression.md
          - Multiple Linear Regression: examples/regression/multiple-linear-regression.md
      - Classification:
          - Overview: examples/classification/index.md
          - Spam Classification: examples/classification/spam-classification.md
          - Multiclass Classification: examples/classification/multiclass-classification.md
      - Running the Examples: examples/running-examples.md

  - Course:
      - ML Basics: lectures/01-ml-basics.md
      - Neural Networks: lectures/02-neural-networks.md
      - Deep Netts API: lectures/03-deep-netts-api.md
      - Model Development: lectures/04-model-development.md

  - Glossary: glossary.md
  - Next Steps: next-steps.md
