site_name: Deep Netts Course
site_description: Deep Netts Machine Learning cookbook for Java developers
site_author: Deep Netts

theme:
  name: github
  custom_dir: overrides
  highlightjs: true
  hljs_style: github

extra_css:
  - assets/course.css

extra_javascript:
  - assets/course.js

nav:
