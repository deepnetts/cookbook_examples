site_name: "Learn Neural Networks with Java: A Code-First Machine Learning Course"
site_description: Deep Netts Machine Learning cookbook for Java developers
site_author: Deep Netts

extra:
  feedback_endpoint: !ENV [DEEPNETTS_FEEDBACK_ENDPOINT, ""]

theme:
  name: github
  custom_dir: overrides
  highlightjs: true
  hljs_style: github

extra_css:
  - assets/course.css

extra_javascript:
  - assets/course.js
  - assets/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true

nav:
  - Get Started:
      - Overview: getting-started/index.md

  - Examples:
      - Overview: examples/index.md
      - Regression: examples/regression/index.md
      - Classification: examples/classification/index.md
      - Image Classification: examples/image-classification/index.md
      - NLP: examples/nlp/index.md
      - Language Models: examples/language-models/index.md

  - Developer Guide:
      - Overview: developer-guide/index.md
      - Loading Data: developer-guide/loading-data.md
      - Preparing Data: developer-guide/preparing-data.md
      - Creating a Model: developer-guide/creating-model.md
      - Training a Model: developer-guide/training-model.md
      - Evaluating a Model: developer-guide/evaluating-model.md
      - Saving and Loading: developer-guide/saving-loading.md
      - Making Predictions: developer-guide/making-predictions.md
      - JSR 381 and Deep Netts: developer-guide/jsr381.md

  - Course:
      - Overview: course/index.md
      - Machine Learning Basics: lectures/01-ml-basics.md
      - Linear Regression: lectures/02-linear-regression.md
      - Logistic Regression: lectures/03-logistic-regression.md
      - Neural Networks: lectures/02-neural-networks.md
      - Backpropagation: lectures/05-backpropagation.md
      - Convolutional Neural Networks: lectures/06-convolutional-neural-networks.md
      - Deep Netts API: lectures/03-deep-netts-api.md
      - Model Development: lectures/04-model-development.md
      - Natural Language Processing: lectures/05-natural-language-processing.md
      - Generative AI: lectures/06-generative-ai.md

  - API DOC: https://www.deepnetts.com/apidocs/index.html

  - Glossary: glossary.md
