<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="title description">
  <title id="title">A convolutional filter creates a feature map</title>
  <desc id="description">A three by three filter moves across a local image region, calculates a weighted response, and writes that response into a feature map.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10" fill="none" stroke="#087ca7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#fff" stroke="#cfe3eb"/>
    </pattern>
  </defs>
  <rect width="900" height="460" rx="18" fill="#f8fdff"/>
  <g font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="450" y="43" fill="#172b4d" font-size="22" font-weight="750" text-anchor="middle">A filter detects the same local pattern across an image</text>
    <text x="190" y="86" fill="#075985" font-size="16" font-weight="700" text-anchor="middle">Input pixels</text>
    <rect x="70" y="105" width="240" height="240" fill="url(#grid)" stroke="#67c4e3" stroke-width="2"/>
    <rect x="110" y="145" width="120" height="120" fill="#dff7ff" fill-opacity="0.82" stroke="#087ca7" stroke-width="4"/>
    <text x="190" y="373" fill="#52657a" font-size="13" text-anchor="middle">one local receptive field</text>

    <path d="M330 225 H395" stroke="#087ca7" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="410" y="125" width="170" height="200" rx="14" fill="#fff" stroke="#8dd8ea" stroke-width="2"/>
    <text x="495" y="158" fill="#075985" font-size="16" font-weight="700" text-anchor="middle">3 × 3 filter</text>
    <g fill="#edf8f1" stroke="#75bd8c">
      <rect x="440" y="182" width="36" height="36"/><rect x="476" y="182" width="36" height="36"/><rect x="512" y="182" width="36" height="36"/>
      <rect x="440" y="218" width="36" height="36"/><rect x="476" y="218" width="36" height="36"/><rect x="512" y="218" width="36" height="36"/>
      <rect x="440" y="254" width="36" height="36"/><rect x="476" y="254" width="36" height="36"/><rect x="512" y="254" width="36" height="36"/>
    </g>
    <text x="495" y="350" fill="#52657a" font-size="13" text-anchor="middle">shared learned weights</text>

    <path d="M595 225 H660" stroke="#087ca7" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="760" y="86" fill="#215f36" font-size="16" font-weight="700" text-anchor="middle">Feature map</text>
    <rect x="680" y="125" width="160" height="200" rx="10" fill="#edf8f1" stroke="#75bd8c" stroke-width="2"/>
    <g fill="#2f9b53">
      <rect x="700" y="145" width="24" height="24" rx="3" opacity=".25"/><rect x="730" y="145" width="24" height="24" rx="3" opacity=".72"/><rect x="760" y="145" width="24" height="24" rx="3" opacity=".4"/><rect x="790" y="145" width="24" height="24" rx="3" opacity=".2"/>
      <rect x="700" y="175" width="24" height="24" rx="3" opacity=".18"/><rect x="730" y="175" width="24" height="24" rx="3" opacity=".92"/><rect x="760" y="175" width="24" height="24" rx="3" opacity=".76"/><rect x="790" y="175" width="24" height="24" rx="3" opacity=".3"/>
      <rect x="700" y="205" width="24" height="24" rx="3" opacity=".2"/><rect x="730" y="205" width="24" height="24" rx="3" opacity=".67"/><rect x="760" y="205" width="24" height="24" rx="3" opacity=".9"/><rect x="790" y="205" width="24" height="24" rx="3" opacity=".43"/>
      <rect x="700" y="235" width="24" height="24" rx="3" opacity=".12"/><rect x="730" y="235" width="24" height="24" rx="3" opacity=".3"/><rect x="760" y="235" width="24" height="24" rx="3" opacity=".63"/><rect x="790" y="235" width="24" height="24" rx="3" opacity=".28"/>
      <rect x="700" y="265" width="24" height="24" rx="3" opacity=".1"/><rect x="730" y="265" width="24" height="24" rx="3" opacity=".19"/><rect x="760" y="265" width="24" height="24" rx="3" opacity=".35"/><rect x="790" y="265" width="24" height="24" rx="3" opacity=".15"/>
    </g>
    <text x="760" y="350" fill="#3e6850" font-size="13" text-anchor="middle">strong response = pattern found</text>
    <rect x="153" y="405" width="594" height="34" rx="9" fill="#fff3cf" stroke="#e5be45"/>
    <text x="450" y="427" fill="#805100" font-size="13" font-weight="700" text-anchor="middle">The filter slides; its weights stay the same at every location.</text>
  </g>
</svg>
