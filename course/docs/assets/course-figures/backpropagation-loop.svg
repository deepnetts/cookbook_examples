<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" role="img" aria-labelledby="title description">
  <title id="title">Forward and backward passes in the neural network learning loop</title>
  <desc id="description">Inputs flow forward through the network to predictions and loss. Gradients flow backward, and the optimizer updates parameters before the next pass.</desc>
  <rect width="880" height="420" rx="18" fill="#f8fdff"/>
  <g font-family="Inter,system-ui,sans-serif">
    <text x="55" y="53" fill="#172b4d" font-size="20" font-weight="700">Forward pass</text>
    <g fill="#fff" stroke="#c9e8f3" stroke-width="2"><rect x="55" y="82" width="150" height="68" rx="12"/><rect x="265" y="82" width="150" height="68" rx="12"/><rect x="475" y="82" width="150" height="68" rx="12"/><rect x="685" y="82" width="140" height="68" rx="12"/></g>
    <g fill="#172b4d" font-size="17" font-weight="600" text-anchor="middle"><text x="130" y="123">Inputs</text><text x="340" y="112">Network</text><text x="340" y="133">layers</text><text x="550" y="123">Prediction</text><text x="755" y="123">Loss</text></g>
    <g stroke="#087ca7" stroke-width="3" fill="none" stroke-linecap="round"><path d="M205 116h52M245 108l12 8-12 8M415 116h52M455 108l12 8-12 8M625 116h52M665 108l12 8-12 8"/></g>
    <text x="55" y="374" fill="#172b4d" font-size="20" font-weight="700">Backward pass and update</text>
    <g fill="#edf8f1" stroke="#75bd8c" stroke-width="2"><rect x="475" y="260" width="150" height="68" rx="12"/><rect x="265" y="260" width="150" height="68" rx="12"/><rect x="55" y="260" width="150" height="68" rx="12"/></g>
    <g fill="#215f36" font-size="16" font-weight="600" text-anchor="middle"><text x="550" y="289">Backpropagation</text><text x="550" y="311">gradients</text><text x="340" y="289">Optimizer</text><text x="340" y="311">update</text><text x="130" y="289">New weights</text><text x="130" y="311">and biases</text></g>
    <g stroke="#2f9b53" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M755 150v144H633M645 286l-12 8 12 8M475 294h-52M435 286l-12 8 12 8M265 294h-52M225 286l-12 8 12 8M205 276L315 158M298 161l17-3-4 17"/></g>
    <text x="692" y="286" fill="#52657a" font-size="14" text-anchor="middle">chain rule</text><text x="250" y="211" fill="#52657a" font-size="14" text-anchor="middle" transform="rotate(-47 250 211)">next pass</text>
  </g>
</svg>
