<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 285" role="img" aria-labelledby="title description">
  <title id="title">From a forward pass to a neural network parameter update</title>
  <desc id="description">The network performs a forward pass, calculates prediction and loss, uses backpropagation to calculate gradients, and lets the optimizer update weights and biases.</desc>
  <rect width="900" height="285" rx="18" fill="#f8fdff"/>
  <g font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <g fill="#ffffff" stroke="#c9e8f3" stroke-width="2">
      <rect x="45" y="70" width="165" height="78" rx="12"/>
      <rect x="260" y="70" width="165" height="78" rx="12"/>
      <rect x="475" y="70" width="165" height="78" rx="12"/>
    </g>
    <rect x="690" y="70" width="165" height="78" rx="12" fill="#edf8f1" stroke="#75bd8c" stroke-width="2"/>
    <g fill="#172b4d" font-size="16" font-weight="600" text-anchor="middle">
      <text x="127" y="105">Forward pass</text><text x="127" y="127">through layers</text>
      <text x="342" y="105">Prediction</text><text x="342" y="127">and loss</text>
      <text x="557" y="96">Backpropagation</text><text x="557" y="118">calculates</text><text x="557" y="140">gradients</text>
    </g>
    <g fill="#215f36" font-size="16" font-weight="600" text-anchor="middle"><text x="772" y="96">Optimizer</text><text x="772" y="118">updates</text><text x="772" y="140">parameters</text></g>
    <g fill="none" stroke="#087ca7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M210 109h42M240 101l12 8-12 8M425 109h42M455 101l12 8-12 8M640 109h42M670 101l12 8-12 8"/>
    </g>
    <g fill="#e5f7fc" stroke="#67c4e3"><rect x="455" y="186" width="205" height="40" rx="20"/><rect x="690" y="186" width="165" height="40" rx="20"/></g>
    <g fill="#075985" font-size="14" font-weight="700" text-anchor="middle"><text x="557" y="211">chain rule</text><text x="772" y="211">learning rate</text></g>
    <path d="M557 186v-30M772 186v-30" fill="none" stroke="#67c4e3" stroke-width="2" stroke-dasharray="5 5"/>
  </g>
</svg>
