<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" role="img" aria-labelledby="title description">
  <title id="title">High-level neural network prediction pipeline</title>
  <desc id="description">Input data enters a neural network model, which transforms the feature values and produces an output prediction.</desc>
  <rect width="880" height="240" rx="18" fill="#f8fdff"/>
  <g font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <g fill="#ffffff" stroke="#c9e8f3" stroke-width="2">
      <rect x="55" y="72" width="185" height="92" rx="14"/>
      <rect x="347" y="62" width="195" height="112" rx="56"/>
    </g>
    <rect x="640" y="72" width="185" height="92" rx="14" fill="#edf8f1" stroke="#75bd8c" stroke-width="2"/>

    <g fill="#172b4d" text-anchor="middle">
      <text x="147" y="111" font-size="18" font-weight="700">Input data</text>
      <text x="147" y="137" fill="#52657a" font-size="14">feature values</text>
      <text x="444" y="106" font-size="18" font-weight="700">Neural network</text>
      <text x="444" y="132" fill="#52657a" font-size="14">learned transformation</text>
      <text x="444" y="153" fill="#52657a" font-size="14">weights + biases</text>
    </g>
    <g fill="#215f36" text-anchor="middle">
      <text x="732" y="111" font-size="18" font-weight="700">Output</text>
      <text x="732" y="137" font-size="14" font-weight="600">prediction</text>
    </g>

    <g fill="none" stroke="#087ca7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M240 118h95M321 108l14 10-14 10M542 118h86M614 108l14 10-14 10"/>
    </g>
  </g>
</svg>
