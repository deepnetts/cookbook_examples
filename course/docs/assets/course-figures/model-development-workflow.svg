<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" role="img" aria-labelledby="title description">
  <title id="title">Leakage-safe model-development workflow</title>
  <desc id="description">The workflow moves from a defined problem to inspected data, then splits data before fitting preprocessing on training data only, trains a suitable model, evaluates on unseen test data, and saves the complete prediction pipeline.</desc>
  <rect width="880" height="470" rx="18" fill="#f8fdff"/>
  <g font-family="Inter,system-ui,sans-serif">
    <g fill="#fff" stroke="#c9e8f3" stroke-width="2"><rect x="45" y="65" width="170" height="64" rx="12"/><rect x="260" y="65" width="170" height="64" rx="12"/><rect x="475" y="65" width="170" height="64" rx="12"/></g>
    <rect x="690" y="65" width="145" height="64" rx="12" fill="#fff3cf" stroke="#e5be45" stroke-width="2"/>
    <g fill="#fff" stroke="#c9e8f3" stroke-width="2"><rect x="690" y="265" width="145" height="64" rx="12"/><rect x="475" y="265" width="170" height="64" rx="12"/><rect x="260" y="265" width="170" height="64" rx="12"/><rect x="45" y="265" width="170" height="64" rx="12"/></g>
    <g fill="#172b4d" font-size="15" font-weight="600" text-anchor="middle"><text x="130" y="103">Define problem</text><text x="345" y="92">Load and</text><text x="345" y="113">inspect data</text><text x="560" y="92">Train / test</text><text x="560" y="113">split</text><text x="762" y="92">Fit preprocessing</text><text x="762" y="113">on TRAIN only</text><text x="762" y="292">Build and train</text><text x="762" y="313">model</text><text x="560" y="292">Evaluate on</text><text x="560" y="313">unseen test data</text><text x="345" y="292">Save complete</text><text x="345" y="313">pipeline</text><text x="130" y="292">Predict new</text><text x="130" y="313">samples</text></g>
    <g stroke="#087ca7" stroke-width="3" fill="none" stroke-linecap="round"><path d="M215 97h37M240 89l12 8-12 8M430 97h37M455 89l12 8-12 8M645 97h37M670 89l12 8-12 8M762 129v128M754 245l8 12 8-12M690 297h-37M665 289l-12 8 12 8M475 297h-37M450 289l-12 8 12 8M260 297h-37M235 289l-12 8 12 8"/></g>
    <path d="M560 129v74h100" fill="none" stroke="#2f9b53" stroke-width="3" stroke-linecap="round"/>
    <path d="m648 195 12 8-12 8" fill="none" stroke="#2f9b53" stroke-width="3" stroke-linecap="round"/>
    <rect x="660" y="174" width="175" height="58" rx="10" fill="#edf8f1" stroke="#75bd8c" stroke-width="2"/>
    <text x="747" y="198" fill="#215f36" font-size="14" font-weight="600" text-anchor="middle">Transform test with</text><text x="747" y="218" fill="#215f36" font-size="14" font-weight="600" text-anchor="middle">training parameters</text>
    <rect x="212" y="382" width="456" height="50" rx="25" fill="#e5f7fc" stroke="#67c4e3"/>
    <text x="440" y="413" fill="#075985" font-size="16" font-weight="700" text-anchor="middle">Model + preprocessing + feature order + metadata</text>
  </g>
</svg>
