site_name: Machine Learning with Java and Deep Netts
site_description: Deep Netts Machine Learning cookbook for Java developers
site_author: Deep Netts

theme:
  name: github
  custom_dir: overrides
  highlightjs: true
  hljs_style: github

extra_css:
  - assets/course.css

extra_javascript:
  - assets/course.js

markdown_extensions:
  - admonition
  - pymdownx.details

nav:
  - Getting Started: getting-started/index.md

  - Examples:
      - Overview: examples/index.md
      - Regression: examples/regression/index.md
      - Classification: examples/classification/index.md
      - Image Classification: examples/image-classification/index.md
      - NLP: examples/nlp/index.md

  - API Documentation: api-documentation/index.md

  - Developer Guide:
      - Overview: developer-guide/index.md
      - Loading Data: developer-guide/loading-data.md
      - Preparing Data: developer-guide/preparing-data.md
      - Creating a Model: developer-guide/creating-model.md
      - Training a Model: developer-guide/training-model.md
      - Evaluating a Model: developer-guide/evaluating-model.md
      - Saving and Loading: developer-guide/saving-loading.md
      - Making Predictions: developer-guide/making-predictions.md

  - Course:
      - Overview: index.md
      - ML Basics: lectures/01-ml-basics.md
      - Neural Networks: lectures/02-neural-networks.md
      - Deep Netts API: lectures/03-deep-netts-api.md
      - Model Development: lectures/04-model-development.md

  - Glossary: glossary.md
