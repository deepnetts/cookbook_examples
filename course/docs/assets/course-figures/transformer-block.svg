<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 680" role="img" aria-labelledby="title description">
  <title id="title">Transformer block with a shared input and residual connections</title>
  <desc id="description">Input representations branch into query, key, and value projections for multi-head attention. A residual path starts from the shared original input, bypasses attention, and joins its output before normalization. A second residual connection bypasses the feed-forward network.</desc>
  <rect width="880" height="680" rx="18" fill="#f8fdff"/>

  <g font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <rect x="340" y="24" width="200" height="52" rx="12" fill="#ffffff" stroke="#087ca7" stroke-width="2.5"/>
    <text x="440" y="57" fill="#172b4d" font-size="17" font-weight="700" text-anchor="middle">Input representations</text>

    <g fill="none" stroke="#087ca7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M440 76v30H145v28M440 106v28M440 106h295v28"/>
      <path d="m137 122 8 12 8-12M432 122l8 12 8-12M727 122l8 12 8-12"/>
    </g>

    <g fill="#e5f7fc" stroke="#67c4e3" stroke-width="2">
      <rect x="55" y="134" width="180" height="62" rx="12"/>
      <rect x="350" y="134" width="180" height="62" rx="12"/>
      <rect x="645" y="134" width="180" height="62" rx="12"/>
    </g>
    <g fill="#075985" font-size="17" font-weight="700" text-anchor="middle">
      <text x="145" y="172">Query · Q</text>
      <text x="440" y="172">Key · K</text>
      <text x="735" y="172">Value · V</text>
    </g>

    <g fill="none" stroke="#087ca7" stroke-width="3" stroke-linecap="round">
      <path d="M145 196v44h240M440 196v44M735 196v44H495"/>
    </g>
    <rect x="335" y="240" width="210" height="68" rx="12" fill="#ffffff" stroke="#087ca7" stroke-width="2.5"/>
    <text x="440" y="269" fill="#172b4d" font-size="17" font-weight="700" text-anchor="middle">Multi-head attention</text>
    <text x="440" y="292" fill="#52657a" font-size="14" text-anchor="middle">softmax(QKᵀ / √dₖ)V</text>

    <path d="M440 308v50" fill="none" stroke="#087ca7" stroke-width="3"/>
    <path d="m432 346 8 12 8-12" fill="none" stroke="#087ca7" stroke-width="3" stroke-linecap="round"/>
    <rect x="300" y="358" width="280" height="56" rx="12" fill="#edf8f1" stroke="#75bd8c" stroke-width="2"/>
    <text x="440" y="392" fill="#215f36" font-size="16" font-weight="700" text-anchor="middle">Add + normalization</text>

    <path d="M340 50H260V386h32" fill="none" stroke="#2f9b53" stroke-width="2.5" stroke-dasharray="7 6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="m280 378 12 8-12 8" fill="none" stroke="#2f9b53" stroke-width="2.5" stroke-linecap="round"/>
    <text x="245" y="223" fill="#215f36" font-size="14" text-anchor="middle" transform="rotate(-90 245 223)">residual from shared input</text>

    <path d="M440 414v44" fill="none" stroke="#087ca7" stroke-width="3"/>
    <path d="m432 446 8 12 8-12" fill="none" stroke="#087ca7" stroke-width="3" stroke-linecap="round"/>
    <rect x="300" y="458" width="280" height="56" rx="12" fill="#ffffff" stroke="#c9e8f3" stroke-width="2"/>
    <text x="440" y="492" fill="#172b4d" font-size="16" font-weight="700" text-anchor="middle">Feed-forward network</text>

    <path d="M440 514v44" fill="none" stroke="#087ca7" stroke-width="3"/>
    <path d="m432 546 8 12 8-12" fill="none" stroke="#087ca7" stroke-width="3" stroke-linecap="round"/>
    <rect x="300" y="558" width="280" height="56" rx="12" fill="#edf8f1" stroke="#75bd8c" stroke-width="2"/>
    <text x="440" y="592" fill="#215f36" font-size="16" font-weight="700" text-anchor="middle">Add + normalization</text>

    <path d="M300 386h-38v200h30" fill="none" stroke="#2f9b53" stroke-width="2.5" stroke-dasharray="7 6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="m280 578 12 8-12 8" fill="none" stroke="#2f9b53" stroke-width="2.5" stroke-linecap="round"/>
    <text x="247" y="487" fill="#215f36" font-size="14" text-anchor="middle" transform="rotate(-90 247 487)">residual path</text>

    <path d="M440 614v28" fill="none" stroke="#087ca7" stroke-width="3"/>
    <path d="m432 630 8 12 8-12" fill="none" stroke="#087ca7" stroke-width="3" stroke-linecap="round"/>
    <text x="440" y="665" fill="#52657a" font-size="15" text-anchor="middle">Context-aware output representations</text>
  </g>
</svg>
