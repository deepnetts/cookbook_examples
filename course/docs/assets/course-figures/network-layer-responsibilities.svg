<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title description">
  <title id="title">Three layers inside a neural network</title>
  <desc id="description">A neural network contains an input layer that receives features, hidden layers that learn transformations, and an output layer that produces predictions.</desc>
  <rect width="900" height="360" rx="18" fill="#f8fdff"/>
  <g font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <rect x="42" y="36" width="816" height="288" rx="18" fill="#ffffff" stroke="#74d4e8" stroke-width="2.5"/>
    <rect x="66" y="20" width="190" height="40" rx="10" fill="#073b61"/>
    <text x="161" y="46" fill="#ffffff" font-size="17" font-weight="750" text-anchor="middle">Neural network</text>

    <g>
      <rect x="82" y="101" width="210" height="154" rx="15" fill="#eaf8fb" stroke="#67c4e3" stroke-width="2"/>
      <rect x="345" y="101" width="210" height="154" rx="15" fill="#f5fbfd" stroke="#8dcfdf" stroke-width="2"/>
      <rect x="608" y="101" width="210" height="154" rx="15" fill="#edf8f1" stroke="#75bd8c" stroke-width="2"/>
    </g>

    <g text-anchor="middle">
      <text x="187" y="149" fill="#075985" font-size="19" font-weight="750">Input layer</text>
      <text x="450" y="149" fill="#075985" font-size="19" font-weight="750">Hidden layers</text>
      <text x="713" y="149" fill="#215f36" font-size="19" font-weight="750">Output layer</text>

      <line x1="116" y1="171" x2="258" y2="171" stroke="#b9dce7" stroke-width="2"/>
      <line x1="379" y1="171" x2="521" y2="171" stroke="#b9dce7" stroke-width="2"/>
      <line x1="642" y1="171" x2="784" y2="171" stroke="#a9d7b7" stroke-width="2"/>

      <text x="187" y="202" fill="#52657a" font-size="14">Receives the feature values</text>
      <text x="187" y="224" fill="#52657a" font-size="14">that define the input contract</text>
      <text x="450" y="202" fill="#52657a" font-size="14">Learn useful nonlinear</text>
      <text x="450" y="224" fill="#52657a" font-size="14">transformations of the data</text>
      <text x="713" y="202" fill="#3e6850" font-size="14">Returns the model's</text>
      <text x="713" y="224" fill="#3e6850" font-size="14">final prediction</text>
    </g>

    <g fill="none" stroke="#087ca7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M292 178h43"/>
      <path d="m323 170 12 8-12 8"/>
      <path d="M555 178h43"/>
      <path d="m586 170 12 8-12 8"/>
    </g>

    <text x="450" y="292" fill="#52657a" font-size="14" font-weight="600" text-anchor="middle">features flow forward through each layer</text>
  </g>
</svg>
