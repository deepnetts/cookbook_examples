<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" role="img" aria-labelledby="title description">
  <title id="title">Backward gradient flow</title>
  <desc id="description">Gradients flow backward from the loss through output gradients and hidden-layer gradients toward earlier layers.</desc>
  <rect width="900" height="290" rx="18" fill="#f8fdff"/>
  <g font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="450" y="46" fill="#172b4d" font-size="21" font-weight="700" text-anchor="middle">Gradients move backward through the network</text>

    <rect x="45" y="98" width="174" height="92" rx="13" fill="#f5fbfd" stroke="#8dcfdf" stroke-width="2"/>
    <rect x="264" y="98" width="190" height="92" rx="13" fill="#eaf8fb" stroke="#67c4e3" stroke-width="2"/>
    <rect x="499" y="98" width="190" height="92" rx="13" fill="#eaf8fb" stroke="#67c4e3" stroke-width="2"/>
    <rect x="734" y="98" width="121" height="92" rx="13" fill="#fff5df" stroke="#e0aa45" stroke-width="2"/>

    <g text-anchor="middle">
      <text x="132" y="137" fill="#172b4d" font-size="16" font-weight="700">Earlier layers</text>
      <text x="132" y="162" fill="#52657a" font-size="13">receive their gradients</text>

      <text x="359" y="132" fill="#075985" font-size="16" font-weight="700">Hidden-layer</text>
      <text x="359" y="154" fill="#075985" font-size="16" font-weight="700">gradients</text>
      <text x="359" y="175" fill="#52657a" font-size="12">chain rule continues</text>

      <text x="594" y="132" fill="#075985" font-size="16" font-weight="700">Output</text>
      <text x="594" y="154" fill="#075985" font-size="16" font-weight="700">gradients</text>
      <text x="594" y="175" fill="#52657a" font-size="12">prediction error begins</text>

      <text x="794" y="151" fill="#805a14" font-size="18" font-weight="750">Loss</text>
      <text x="794" y="174" fill="#765e31" font-size="12">training signal</text>
    </g>

    <g fill="none" stroke="#087ca7" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M264 144h-35"/><path d="m241 135-12 9 12 9"/>
      <path d="M499 144h-35"/><path d="m476 135-12 9 12 9"/>
      <path d="M734 144h-35"/><path d="m711 135-12 9 12 9"/>
    </g>

    <path d="M794 211H132" fill="none" stroke="#2f9b53" stroke-width="2.5" stroke-dasharray="7 6" stroke-linecap="round"/>
    <path d="m144 203-12 8 12 8" fill="none" stroke="#2f9b53" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="463" y="241" fill="#215f36" font-size="14" font-weight="650" text-anchor="middle">backward gradient flow</text>
  </g>
</svg>
