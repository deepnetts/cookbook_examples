<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-labelledby="title description">
  <title id="title">Output layer selection by prediction task</title>
  <desc id="description">Regression uses one Linear output, binary classification uses one Sigmoid output, and multiclass classification uses one Softmax output for each class.</desc>
  <rect width="900" height="390" rx="18" fill="#f8fdff"/>
  <g font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="450" y="48" fill="#172b4d" font-size="21" font-weight="700" text-anchor="middle">Choose the output layer for the task</text>

    <g fill="#ffffff" stroke="#8dd8ea" stroke-width="2">
      <rect x="64" y="83" width="286" height="78" rx="13"/>
      <rect x="64" y="177" width="286" height="78" rx="13"/>
      <rect x="64" y="271" width="286" height="78" rx="13"/>
    </g>
    <g text-anchor="middle">
      <text x="207" y="130" fill="#172b4d" font-size="17" font-weight="700">Regression</text>
      <text x="207" y="224" fill="#172b4d" font-size="17" font-weight="700">Binary classification</text>
      <text x="207" y="318" fill="#172b4d" font-size="17" font-weight="700">Multiclass classification</text>
    </g>

    <g fill="none" stroke="#087ca7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M350 122h140"/><path d="m478 114 12 8-12 8"/>
      <path d="M350 216h140"/><path d="m478 208 12 8-12 8"/>
      <path d="M350 310h140"/><path d="m478 302 12 8-12 8"/>
    </g>

    <g>
      <rect x="500" y="83" width="336" height="78" rx="13" fill="#edf8f1" stroke="#75bd8c" stroke-width="2"/>
      <rect x="500" y="177" width="336" height="78" rx="13" fill="#eaf8fb" stroke="#67c4e3" stroke-width="2"/>
      <rect x="500" y="271" width="336" height="78" rx="13" fill="#f5fbfd" stroke="#8dcfdf" stroke-width="2"/>
    </g>
    <g text-anchor="middle">
      <text x="668" y="116" fill="#215f36" font-size="18" font-weight="750">1 Linear output</text>
      <text x="668" y="140" fill="#3e6850" font-size="13">continuous numerical value</text>

      <text x="668" y="210" fill="#075985" font-size="18" font-weight="750">1 Sigmoid output</text>
      <text x="668" y="234" fill="#52657a" font-size="13">positive-class probability</text>

      <text x="668" y="304" fill="#075985" font-size="18" font-weight="750">Softmax output per class</text>
      <text x="668" y="328" fill="#52657a" font-size="13">comparable class probabilities</text>
    </g>
  </g>
</svg>
