<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title description">
  <title id="title">Typical convolutional neural network architecture</title>
  <desc id="description">An image passes through convolution, activation, pooling, fully connected layers, and a task-specific classification output.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#087ca7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect width="900" height="360" rx="18" fill="#f8fdff"/>
  <g font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="450" y="44" fill="#172b4d" font-size="22" font-weight="750" text-anchor="middle">A CNN learns spatial features before making a decision</text>
    <g text-anchor="middle">
      <rect x="38" y="104" width="120" height="100" rx="12" fill="#fff" stroke="#8dd8ea" stroke-width="2"/>
      <rect x="191" y="94" width="130" height="120" rx="12" fill="#fff" stroke="#67c4e3" stroke-width="2"/>
      <rect x="354" y="109" width="120" height="90" rx="12" fill="#fff" stroke="#8dd8ea" stroke-width="2"/>
      <rect x="507" y="104" width="130" height="100" rx="12" fill="#fff" stroke="#8dd8ea" stroke-width="2"/>
      <rect x="670" y="94" width="192" height="120" rx="12" fill="#edf8f1" stroke="#75bd8c" stroke-width="2"/>
      <text x="98" y="145" fill="#075985" font-size="15" font-weight="700">Image</text><text x="98" y="169" fill="#52657a" font-size="12">H × W × C</text>
      <text x="256" y="137" fill="#075985" font-size="15" font-weight="700">Convolution</text><text x="256" y="161" fill="#52657a" font-size="12">filters + activation</text><text x="256" y="184" fill="#52657a" font-size="12">feature maps</text>
      <text x="414" y="145" fill="#075985" font-size="15" font-weight="700">Pooling</text><text x="414" y="169" fill="#52657a" font-size="12">reduce H and W</text>
      <text x="572" y="145" fill="#075985" font-size="15" font-weight="700">Dense layers</text><text x="572" y="169" fill="#52657a" font-size="12">combine features</text>
      <text x="766" y="132" fill="#215f36" font-size="15" font-weight="700">Classification output</text><text x="766" y="159" fill="#3e6850" font-size="12">Sigmoid: binary</text><text x="766" y="182" fill="#3e6850" font-size="12">Softmax: multiclass</text>
    </g>
    <g stroke="#087ca7" stroke-width="2.5" marker-end="url(#arrow)"><path d="M159 154 H188"/><path d="M322 154 H351"/><path d="M475 154 H504"/><path d="M638 154 H667"/></g>
    <path d="M256 233 V276 H414 V217" fill="none" stroke="#2f9b53" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
    <text x="335" y="300" fill="#2f7d48" font-size="13" font-weight="700" text-anchor="middle">repeat convolution and pooling as needed</text>
    <text x="450" y="331" fill="#52657a" font-size="13" text-anchor="middle">Earlier layers detect local patterns; later layers combine them into task-specific evidence.</text>
  </g>
</svg>
