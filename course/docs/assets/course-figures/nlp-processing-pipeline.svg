<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="title description">
  <title id="title">Natural Language Processing pipeline</title>
  <desc id="description">Raw text is normalized and tokenized, converted into a numerical representation, processed by a model, and converted into a task-specific output.</desc>
  <rect width="900" height="330" rx="18" fill="#f8fdff"/>
  <g font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <rect x="36" y="34" width="828" height="254" rx="18" fill="#ffffff" stroke="#74d4e8" stroke-width="2.5"/>
    <rect x="62" y="18" width="268" height="42" rx="11" fill="#073b61"/>
    <text x="196" y="46" fill="#ffffff" font-size="17" font-weight="750" text-anchor="middle">Natural Language Processing</text>

    <g>
      <rect x="64" y="96" width="132" height="108" rx="13" fill="#f5fbfd" stroke="#8dcfdf" stroke-width="2"/>
      <rect x="226" y="96" width="142" height="108" rx="13" fill="#eaf8fb" stroke="#67c4e3" stroke-width="2"/>
      <rect x="398" y="96" width="158" height="108" rx="13" fill="#eaf8fb" stroke="#67c4e3" stroke-width="2"/>
      <rect x="586" y="96" width="112" height="108" rx="13" fill="#ffffff" stroke="#8dcfdf" stroke-width="2"/>
      <rect x="728" y="96" width="108" height="108" rx="13" fill="#edf8f1" stroke="#75bd8c" stroke-width="2"/>
    </g>
    <g text-anchor="middle">
      <text x="130" y="136" fill="#172b4d" font-size="16" font-weight="700">Raw text</text>
      <text x="130" y="162" fill="#52657a" font-size="12">words, punctuation,</text><text x="130" y="180" fill="#52657a" font-size="12">document structure</text>

      <text x="297" y="128" fill="#075985" font-size="16" font-weight="700">Normalize</text><text x="297" y="150" fill="#075985" font-size="16" font-weight="700">and tokenize</text>
      <text x="297" y="178" fill="#52657a" font-size="12">text → tokens</text>

      <text x="477" y="128" fill="#075985" font-size="16" font-weight="700">Numerical</text><text x="477" y="150" fill="#075985" font-size="16" font-weight="700">representation</text>
      <text x="477" y="178" fill="#52657a" font-size="12">vectors or sequences</text>

      <text x="642" y="139" fill="#172b4d" font-size="16" font-weight="700">Model</text>
      <text x="642" y="165" fill="#52657a" font-size="12">learned</text><text x="642" y="182" fill="#52657a" font-size="12">transformation</text>

      <text x="782" y="139" fill="#215f36" font-size="16" font-weight="700">Output</text>
      <text x="782" y="165" fill="#3e6850" font-size="12">class, score,</text><text x="782" y="182" fill="#3e6850" font-size="12">labels, or text</text>
    </g>
    <g fill="none" stroke="#087ca7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M196 150h30"/><path d="m214 142 12 8-12 8"/>
      <path d="M368 150h30"/><path d="m386 142 12 8-12 8"/>
      <path d="M556 150h30"/><path d="m574 142 12 8-12 8"/>
      <path d="M698 150h30"/><path d="m716 142 12 8-12 8"/>
    </g>
    <text x="450" y="248" fill="#52657a" font-size="13" font-weight="600" text-anchor="middle">The model receives numbers, not raw language.</text>
    <text x="450" y="269" fill="#52657a" font-size="13" font-weight="600" text-anchor="middle">Those numbers preserve selected information about the text.</text>
  </g>
</svg>
