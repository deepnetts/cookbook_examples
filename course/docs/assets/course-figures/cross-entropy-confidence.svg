<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" role="img" aria-labelledby="title description">
  <title id="title">Binary cross-entropy penalizes confident wrong predictions</title>
  <desc id="description">For an actual positive label, a prediction of 0.95 has low loss, 0.50 has moderate loss, and 0.05 has high loss.</desc>
  <rect width="900" height="370" rx="18" fill="#f8fdff"/>
  <g font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="450" y="45" fill="#172b4d" font-size="21" font-weight="700" text-anchor="middle">Cross-Entropy responds to confidence</text>
    <text x="450" y="72" fill="#52657a" font-size="14" text-anchor="middle">Example: the actual label is positive (y = 1)</text>
    <g>
      <rect x="55" y="102" width="240" height="218" rx="15" fill="#edf8f1" stroke="#75bd8c" stroke-width="2"/>
      <rect x="330" y="102" width="240" height="218" rx="15" fill="#fff9ec" stroke="#e2bd68" stroke-width="2"/>
      <rect x="605" y="102" width="240" height="218" rx="15" fill="#fff1ed" stroke="#df8978" stroke-width="2"/>
    </g>
    <g text-anchor="middle">
      <text x="175" y="143" fill="#215f36" font-size="17" font-weight="750">Confident and correct</text>
      <text x="450" y="143" fill="#805a14" font-size="17" font-weight="750">Uncertain</text>
      <text x="725" y="143" fill="#8a3528" font-size="17" font-weight="750">Confident and wrong</text>
      <text x="175" y="190" fill="#172b4d" font-size="28" font-weight="800">p = 0.95</text>
      <text x="450" y="190" fill="#172b4d" font-size="28" font-weight="800">p = 0.50</text>
      <text x="725" y="190" fill="#172b4d" font-size="28" font-weight="800">p = 0.05</text>
      <text x="175" y="229" fill="#3e6850" font-size="15" font-weight="650">loss ≈ 0.05</text>
      <text x="450" y="229" fill="#765e31" font-size="15" font-weight="650">loss ≈ 0.69</text>
      <text x="725" y="229" fill="#7a3b31" font-size="15" font-weight="650">loss ≈ 3.00</text>
      <rect x="105" y="263" width="140" height="12" rx="6" fill="#d7eadc"/><rect x="105" y="263" width="12" height="12" rx="6" fill="#2f9b53"/>
      <rect x="380" y="263" width="140" height="12" rx="6" fill="#efe3c7"/><rect x="380" y="263" width="49" height="12" rx="6" fill="#d19a32"/>
      <rect x="655" y="263" width="140" height="12" rx="6" fill="#efd8d2"/><rect x="655" y="263" width="140" height="12" rx="6" fill="#c85e4d"/>
      <text x="175" y="300" fill="#52657a" font-size="12">low penalty</text><text x="450" y="300" fill="#52657a" font-size="12">moderate penalty</text><text x="725" y="300" fill="#52657a" font-size="12">large penalty</text>
    </g>
  </g>
</svg>
