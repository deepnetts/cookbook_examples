<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" role="img" aria-labelledby="title description">
  <title id="title">Training and test dataset split</title>
  <desc id="description">A complete dataset is split into a training set used to learn weights and biases and a test set used to measure model behavior on unseen samples.</desc>
  <rect width="900" height="310" rx="18" fill="#f8fdff"/>
  <g font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="45" y="48" fill="#172b4d" font-size="21" font-weight="700">Train on one set, evaluate on another</text>

    <rect x="42" y="113" width="176" height="82" rx="13" fill="#ffffff" stroke="#74d4e8" stroke-width="2"/>
    <text x="130" y="148" fill="#172b4d" font-size="16" font-weight="700" text-anchor="middle">Complete</text>
    <text x="130" y="171" fill="#172b4d" font-size="16" font-weight="700" text-anchor="middle">dataset</text>

    <g fill="#ffffff" stroke="#c9e8f3" stroke-width="2">
      <rect x="330" y="78" width="170" height="70" rx="12"/>
      <rect x="330" y="194" width="170" height="70" rx="12"/>
    </g>
    <g fill="#172b4d" font-size="16" font-weight="650" text-anchor="middle">
      <text x="415" y="120">Training set</text>
      <text x="415" y="236">Test set</text>
    </g>

    <rect x="624" y="78" width="232" height="70" rx="12" fill="#edf8f1" stroke="#75bd8c" stroke-width="2"/>
    <rect x="624" y="194" width="232" height="70" rx="12" fill="#ffffff" stroke="#74d4e8" stroke-width="2"/>
    <g font-size="15" font-weight="600" text-anchor="middle">
      <text x="740" y="108" fill="#215f36">Learn weights</text>
      <text x="740" y="130" fill="#215f36">and biases</text>
      <text x="740" y="224" fill="#172b4d">Measure behavior on</text>
      <text x="740" y="246" fill="#172b4d">unseen samples</text>
    </g>

    <g fill="none" stroke="#087ca7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M218 154h54v-41h48"/>
      <path d="m308 105 12 8-12 8"/>
      <path d="M272 154v75h48"/>
      <path d="m308 221 12 8-12 8"/>
      <path d="M500 113h114"/>
      <path d="m602 105 12 8-12 8"/>
      <path d="M500 229h114"/>
      <path d="m602 221 12 8-12 8"/>
    </g>

    <circle cx="272" cy="154" r="5" fill="#087ca7"/>
    <text x="272" y="286" fill="#52677a" font-size="13" text-anchor="middle">The test set is kept separate during training.</text>
  </g>
</svg>
