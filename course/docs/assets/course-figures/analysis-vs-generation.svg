<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" role="img" aria-labelledby="title description">
  <title id="title">Traditional Machine Learning compared with Generative AI</title>
  <desc id="description">Traditional Machine Learning maps input features through a model to a class or numerical value, while Generative AI maps context or noise through a generative model to new content.</desc>
  <rect width="900" height="370" rx="18" fill="#f8fdff"/>
  <g font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="450" y="45" fill="#172b4d" font-size="21" font-weight="700" text-anchor="middle">Analysis and generation use different output contracts</text>

    <rect x="42" y="78" width="816" height="112" rx="15" fill="#ffffff" stroke="#8dd8ea" stroke-width="2"/>
    <rect x="42" y="210" width="816" height="112" rx="15" fill="#ffffff" stroke="#75bd8c" stroke-width="2"/>

    <g text-anchor="middle">
      <text x="137" y="125" fill="#075985" font-size="17" font-weight="750">Traditional ML</text>
      <text x="137" y="150" fill="#52657a" font-size="13">analyze existing input</text>
      <text x="137" y="257" fill="#215f36" font-size="17" font-weight="750">Generative AI</text>
      <text x="137" y="282" fill="#3e6850" font-size="13">create a new sample</text>

      <rect x="250" y="101" width="150" height="66" rx="11" fill="#eaf8fb" stroke="#67c4e3" stroke-width="2"/>
      <rect x="250" y="233" width="150" height="66" rx="11" fill="#edf8f1" stroke="#75bd8c" stroke-width="2"/>
      <text x="325" y="129" fill="#075985" font-size="16" font-weight="700">Features</text><text x="325" y="151" fill="#52657a" font-size="12">numerical input</text>
      <text x="325" y="258" fill="#215f36" font-size="16" font-weight="700">Context or noise</text>
      <text x="325" y="278" fill="#3e6850" font-size="11.5">prompt, tokens, or</text>
      <text x="325" y="292" fill="#3e6850" font-size="11.5">latent input</text>

      <rect x="472" y="101" width="130" height="66" rx="11" fill="#ffffff" stroke="#8dcfdf" stroke-width="2"/>
      <rect x="472" y="233" width="130" height="66" rx="11" fill="#ffffff" stroke="#8dcfdf" stroke-width="2"/>
      <text x="537" y="140" fill="#172b4d" font-size="16" font-weight="750">Model</text>
      <text x="537" y="262" fill="#172b4d" font-size="15" font-weight="750">Generative</text><text x="537" y="282" fill="#172b4d" font-size="15" font-weight="750">model</text>

      <rect x="674" y="101" width="150" height="66" rx="11" fill="#f5fbfd" stroke="#8dcfdf" stroke-width="2"/>
      <rect x="674" y="233" width="150" height="66" rx="11" fill="#edf8f1" stroke="#75bd8c" stroke-width="2"/>
      <text x="749" y="129" fill="#172b4d" font-size="16" font-weight="700">Class or number</text><text x="749" y="151" fill="#52657a" font-size="12">prediction</text>
      <text x="749" y="261" fill="#215f36" font-size="16" font-weight="700">New content</text><text x="749" y="283" fill="#3e6850" font-size="12">text, image, audio, or code</text>
    </g>

    <g fill="none" stroke="#087ca7" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M400 134h62"/><path d="m450 126 12 8-12 8"/>
      <path d="M602 134h62"/><path d="m652 126 12 8-12 8"/>
    </g>
    <g fill="none" stroke="#2f9b53" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M400 266h62"/><path d="m450 258 12 8-12 8"/>
      <path d="M602 266h62"/><path d="m652 258 12 8-12 8"/>
    </g>
  </g>
</svg>
