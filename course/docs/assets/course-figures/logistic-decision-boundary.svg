<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title description">
  <title id="title">Logistic regression decision boundary</title>
  <desc id="description">A polished scatter plot shows class zero and class one samples separated by a fitted linear decision boundary defined by a Logistic Regression probability model.</desc>
  <rect width="900" height="500" rx="18" fill="#f3fbfe"/>
  <g font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <rect x="82" y="50" width="736" height="386" rx="14" fill="#ffffff" stroke="#9ddfed" stroke-width="2"/>

    <g stroke="#dcecf2" stroke-width="1.5">
      <path d="M142 112V384M262 112V384M382 112V384M502 112V384M622 112V384M742 112V384"/>
      <path d="M142 112H770M142 180H770M142 248H770M142 316H770M142 384H770"/>
    </g>

    <path d="M142 384L708 112H770V384Z" fill="#e8f7fb" opacity=".78"/>
    <path d="M142 384L708 112H142Z" fill="#edf8f1" opacity=".8"/>

    <g fill="none" stroke="#52677a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M142 384H770"/><path d="m758 376 12 8-12 8"/>
      <path d="M142 384V94"/><path d="m134 106 8-12 8 12"/>
    </g>

    <path d="M198 384L708 112" fill="none" stroke="#087ca7" stroke-width="4.5" stroke-linecap="round"/>

    <g fill="#2f9b53" stroke="#ffffff" stroke-width="3">
      <circle cx="210" cy="167" r="10"/><circle cx="260" cy="214" r="10"/><circle cx="310" cy="143" r="10"/><circle cx="354" cy="219" r="10"/><circle cx="401" cy="166" r="10"/><circle cx="445" cy="207" r="10"/><circle cx="493" cy="137" r="10"/>
    </g>
    <g fill="#16a8d5" stroke="#ffffff" stroke-width="3">
      <circle cx="326" cy="329" r="10"/><circle cx="383" cy="350" r="10"/><circle cx="432" cy="298" r="10"/><circle cx="482" cy="340" r="10"/><circle cx="531" cy="279" r="10"/><circle cx="587" cy="320" r="10"/><circle cx="634" cy="250" r="10"/><circle cx="687" cy="286" r="10"/>
    </g>

    <rect x="548" y="22" width="232" height="52" rx="26" fill="#e5f7fc" stroke="#16b8e9" stroke-width="1.5"/>
    <text x="664" y="55" fill="#075985" font-size="18" font-weight="750" text-anchor="middle">p = σ(w·x + b)</text>

    <rect x="555" y="280" width="188" height="82" rx="12" fill="#f1f6f9" fill-opacity=".94" stroke="#c8dce5" stroke-width="1.5"/>
    <g font-size="13" font-weight="600">
      <circle cx="578" cy="301" r="7" fill="#2f9b53"/><text x="596" y="306" fill="#3e6850">Class 0</text>
      <circle cx="578" cy="325" r="7" fill="#16a8d5"/><text x="596" y="330" fill="#075985">Class 1</text>
      <path d="M568 348h30" stroke="#087ca7" stroke-width="4" stroke-linecap="round"/><text x="609" y="353" fill="#172b4d">Boundary</text>
    </g>

    <text x="446" y="472" fill="#172b4d" font-size="15" font-weight="700" text-anchor="middle">Feature 1</text>
    <text x="34" y="250" fill="#172b4d" font-size="15" font-weight="700" text-anchor="middle" transform="rotate(-90 34 250)">Feature 2</text>

    <g fill="#52677a" font-size="12" text-anchor="middle">
      <text x="142" y="405">0</text><text x="262" y="405">0.2</text><text x="382" y="405">0.4</text><text x="502" y="405">0.6</text><text x="622" y="405">0.8</text><text x="742" y="405">1.0</text>
    </g>
    <g fill="#52677a" font-size="12" text-anchor="end">
      <text x="130" y="388">0</text><text x="130" y="320">0.25</text><text x="130" y="252">0.5</text><text x="130" y="184">0.75</text><text x="130" y="116">1.0</text>
    </g>

    <text x="329" y="287" fill="#073b61" font-size="13" font-weight="750" transform="rotate(-28 329 287)">p = 0.5 decision boundary</text>
  </g>
</svg>
