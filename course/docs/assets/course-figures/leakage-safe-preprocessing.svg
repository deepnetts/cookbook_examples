<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title description">
  <title id="title">Leakage-safe preprocessing workflow</title>
  <desc id="description">A shuffled dataset is split into training and test sets. Preprocessing is fitted only on training data, then the same fitted transformation is applied to both sets.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10" fill="none" stroke="#087ca7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10" fill="none" stroke="#2f9b53" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="900" height="520" rx="18" fill="#f8fdff"/>
  <g font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="450" y="43" fill="#172b4d" font-size="22" font-weight="750" text-anchor="middle">Fit preprocessing without leaking test information</text>

    <g text-anchor="middle">
      <rect x="54" y="91" width="170" height="68" rx="11" fill="#fff" stroke="#8dd8ea" stroke-width="2"/>
      <rect x="280" y="91" width="170" height="68" rx="11" fill="#fff" stroke="#8dd8ea" stroke-width="2"/>
      <rect x="506" y="91" width="170" height="68" rx="11" fill="#fff" stroke="#8dd8ea" stroke-width="2"/>
      <text x="139" y="120" fill="#075985" font-size="15" font-weight="700">Complete dataset</text>
      <text x="139" y="143" fill="#52657a" font-size="12">all available samples</text>
      <text x="365" y="131" fill="#075985" font-size="15" font-weight="700">Shuffle</text>
      <text x="591" y="131" fill="#075985" font-size="15" font-weight="700">Split</text>
    </g>
    <path d="M225 125 H277 M451 125 H503" fill="none" stroke="#087ca7" stroke-width="2.5" marker-end="url(#arrow)"/>

    <path d="M677 125 H736 V231 H690 M736 125 V373 H690" fill="none" stroke="#087ca7" stroke-width="2.5" marker-end="url(#arrow)"/>
    <g text-anchor="middle">
      <rect x="500" y="197" width="190" height="68" rx="11" fill="#edf8f1" stroke="#75bd8c" stroke-width="2"/>
      <rect x="500" y="339" width="190" height="68" rx="11" fill="#f3f8fa" stroke="#d3e4eb" stroke-width="2"/>
      <text x="595" y="226" fill="#215f36" font-size="15" font-weight="700">Training set</text>
      <text x="595" y="249" fill="#3e6850" font-size="12">allowed to teach the pipeline</text>
      <text x="595" y="368" fill="#172b4d" font-size="15" font-weight="700">Test set</text>
      <text x="595" y="391" fill="#52657a" font-size="12">remains unseen</text>
    </g>

    <path d="M499 231 H381" fill="none" stroke="#2f9b53" stroke-width="2.5" marker-end="url(#green-arrow)"/>
    <rect x="150" y="187" width="230" height="88" rx="11" fill="#edf8f1" stroke="#75bd8c" stroke-width="2"/>
    <text x="265" y="220" fill="#215f36" font-size="15" font-weight="700" text-anchor="middle">Fit preprocessing</text>
    <text x="265" y="244" fill="#3e6850" font-size="12" text-anchor="middle">learn mean, min, max, vocabulary…</text>

    <path d="M265 276 V373 H497" fill="none" stroke="#2f9b53" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#green-arrow)"/>
    <text x="340" y="359" fill="#2f7d48" font-size="12" font-weight="700" text-anchor="middle">apply the same fitted rules</text>

    <rect x="116" y="450" width="668" height="42" rx="10" fill="#fff3cf" stroke="#e5be45"/>
    <text x="450" y="477" fill="#805100" font-size="14" font-weight="700" text-anchor="middle">The test set never contributes statistics, vocabulary, or replacement values.</text>
  </g>
</svg>
